<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-blue-900 to-gray-900 p-6">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl text-gray-800">
    <h2 class="text-2xl font-extrabold text-center mb-2">Restablecer contraseña</h2>
    <p class="text-center text-sm text-gray-600 mb-6">Ingresa tu nueva contraseña (mínimo 8 caracteres)</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="relative">
        <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
          class="w-full p-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="button" (click)="togglePasswordVisibility()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
          @if (showPassword) {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          }
        </button>
      </div>

      @if (errorMessage) {
      <p class="text-center text-sm font-medium text-red-600">{{ errorMessage }}</p>
      }

      <button type="submit"
        class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition">
        {{ isLoading ? 'Actualizando...' : 'Guardar contraseña' }}
      </button>
    </form>
  </div>
</div>

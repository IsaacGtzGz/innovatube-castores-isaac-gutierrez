<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-blue-900 to-gray-900 p-6">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl text-gray-800">
    <h2 class="text-2xl font-extrabold text-center mb-2">Recuperar contraseña</h2>
    <p class="text-center text-sm text-gray-600 mb-6">Ingresa tu correo para recibir las instrucciones</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <input formControlName="email" type="email" placeholder="correo@ejemplo.com"
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      @if (message) {
      <p class="text-center text-sm font-medium text-indigo-600">{{ message }}</p>
      }

      <button type="submit" [disabled]="isLoading"
        class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition">
        {{ isLoading ? 'Enviando...' : 'Enviar instrucciones' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      <a routerLink="/login" class="text-indigo-600 font-semibold hover:underline">Volver al inicio de sesión</a>
    </p>
  </div>
</div>

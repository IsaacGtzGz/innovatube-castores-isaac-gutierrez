<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-blue-900 to-gray-900 p-6 relative">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl text-gray-800">
    <h2 class="text-2xl font-extrabold text-center mb-2">Recuperar contraseña</h2>
    <p class="text-center text-sm text-gray-600 mb-6">Ingresa tu correo para recibir las instrucciones</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <input formControlName="email" type="email" placeholder="usuario@innovatube.com"
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      @if (message) {
      <p class="text-center text-sm font-medium text-red-600">{{ message }}</p>
      }

      <button type="submit" [disabled]="isLoading"
        class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition">
        {{ isLoading ? 'Generando token...' : 'Enviar instrucciones' }}
      </button>
    </form>

    <div class="text-center mt-6">
      <a routerLink="/login" class="text-sm text-indigo-600 hover:underline">Volver al inicio de sesión</a>
    </div>
  </div>

  <!-- # Modal de Token de Seguridad Bancaria -->
  @if (showTokenModal) {
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white max-w-sm w-full p-6 rounded-2xl shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto">
        <!-- Icono SVG de Candado de Seguridad -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>

      <h3 class="text-lg font-bold text-gray-900">Token de Autorización</h3>
      <p class="text-xs text-gray-500">Código de seguridad generado para validar el cambio de credenciales.</p>

      <div class="bg-gray-100 p-3 rounded-xl border border-dashed border-gray-300">
        <span class="font-mono text-sm tracking-widest text-indigo-700 font-bold select-none">
          {{ maskedToken }}
        </span>
      </div>

      <button type="button" (click)="proceedToReset()"
        class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
        Autorizar Operación
      </button>
    </div>
  </div>
  }
</div>s

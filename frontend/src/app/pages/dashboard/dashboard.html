<div class="flex h-screen bg-gray-50 text-gray-900">

  <!-- Sidebar Izquierdo -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
    <div class="h-16 flex items-center px-6 border-b border-slate-800">
      <h1 class="text-xl font-extrabold tracking-wider">Innova<span class="text-blue-500">Tube</span></h1>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2">
      <a routerLink="/dashboard"
        class="flex items-center gap-3 px-3 py-3 bg-blue-600 rounded-xl text-white font-medium transition-all shadow-md shadow-blue-500/20 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
          </path>
        </svg>
        Inicio
      </a>
      <a
        class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
          </path>
        </svg>
        Mis Favoritos
      </a>
    </nav>

    <div class="p-4 border-t border-slate-800">
      <button (click)="logout()"
        class="flex items-center justify-center gap-2 w-full px-4 py-2 rounded-lg text-slate-300 hover:bg-red-500/10 hover:text-red-500 transition-colors border border-transparent hover:border-red-500/30">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Contenedor Principal -->
  <div class="flex-1 flex flex-col overflow-hidden relative">

    <!-- Navbar Superior -->
    <header
      class="h-16 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-8 z-10">
      <h2 class="text-xl font-bold text-slate-800">Explorar Contenido</h2>

      <div class="flex items-center gap-4">
        <!-- Avatar de Usuario -->
        <div
          class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/20 text-white font-bold border-2 border-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
      </div>
    </header>

    <!-- Área Dinámica de Contenido -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-50/50">

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        @for (video of videos; track video.youtube_video_id) {
        <!-- Tarjeta de Video -->
        <article
          class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 group">

          <!-- Miniatura -->
          <div class="relative aspect-video overflow-hidden bg-slate-200">
            <img [src]="video.thumbnail_url" [alt]="video.title"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <!-- Botón de Favorito (Flotante) -->
            <button
              class="absolute top-3 right-3 p-2 bg-white/90 backdrop-blur rounded-full text-slate-400 hover:text-red-500 hover:bg-white transition-colors shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                </path>
              </svg>
            </button>
          </div>

          <!-- Información -->
          <div class="p-4">
            <h3 class="font-bold text-slate-800 leading-tight mb-2 line-clamp-2" [title]="video.title">
              {{ video.title }}
            </h3>
            <div class="flex items-center gap-2 text-sm text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9">
                </path>
              </svg>
              <span class="truncate">{{ video.channel_title }}</span>
            </div>
          </div>

        </article>
        } @empty {
        <!-- Estado Vacío / Cargando -->
        <div
          class="col-span-full border-2 border-dashed border-slate-300 rounded-2xl h-[60vh] flex flex-col items-center justify-center bg-white/50 text-slate-400">
          <svg class="w-12 h-12 mb-4 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <p class="font-medium text-lg">Buscando contenido...</p>
        </div>
        }
      </div>

    </main>
  </div>
</div>
